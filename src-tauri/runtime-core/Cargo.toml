[package]
name = "aether-runtime-core"
version = "0.1.0"
edition = "2021"
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["fs", "io-util", "process", "net", "sync", "time", "macros", "rt-multi-thread"] }
futures-util = "0.3"
fs2 = "0.4"
sha2 = "0.10"
sysinfo = "0.37"
tar = "0.4"
zstd = "0.13"
libc = "0.2"
tokio-util = { version = "0.7", features = ["io"] }
[dev-dependencies]
tempfile = "3"
